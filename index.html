<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thiệp mời tốt nghiệp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #15110c;
    --amber: #ffb000;
    --amber-dim: #b97d00;
    --teal: #3ec9a7;
    --red: #d9482b;
    --ink: #2a2118;
    --paper: #f3e9cf;
    --paper-2: #e6d7ae;
    --kraft: #c29a60;
    --kraft-2: #d6b47c;
    --muted: #6f6048;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    --pixel: "VT323", "IBM Plex Mono", monospace;
    --w: min(88vw, 400px);
    --p: 0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--mono);
    color: var(--ink);
    background:
      radial-gradient(900px 500px at 50% 0%, rgba(255,176,0,.10), transparent 65%),
      linear-gradient(rgba(255,176,0,.045) 1px, transparent 1px) 0 0 / 32px 32px,
      linear-gradient(90deg, rgba(255,176,0,.045) 1px, transparent 1px) 0 0 / 32px 32px,
      var(--bg);
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  /* scanlines + vignette kiểu màn hình CRT */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 30;
    background:
      repeating-linear-gradient(rgba(0,0,0,.16) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.45));
  }

  main {
    min-height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 16px 40px; gap: 26px; position: relative;
  }
  .title { text-align: center; color: var(--amber); text-shadow: 0 0 12px rgba(255,176,0,.55); }
  .title small { font-family: var(--pixel); font-size: 20px; letter-spacing: .2em; color: var(--amber-dim); }
  .title h1 {
    margin: 0; font-family: var(--pixel); font-weight: 400; letter-spacing: .06em;
    font-size: clamp(44px, 12vw, 68px); line-height: 1;
  }
  .title h1::after {
    content: ""; display: inline-block; width: .42em; height: .75em; margin-left: .12em;
    background: var(--amber); vertical-align: -.02em; animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- Phong bì kiểu thư hàng không cũ ---------- */
  .stage { perspective: 1100px; transition: transform .7s ease, opacity .6s ease; }
  .stage.gone { transform: translateY(40px) scale(.9); opacity: 0; pointer-events: none; }
  .env {
    position: relative; width: var(--w); height: calc(var(--w) * .66);
    touch-action: none; cursor: grab; user-select: none; outline: none;
    filter: drop-shadow(0 22px 26px rgba(0,0,0,.6));
    transform: rotate(calc((1 - var(--p)) * -2deg));
  }
  .env:active { cursor: grabbing; }
  .env:focus-visible { outline: 3px solid var(--amber); outline-offset: 8px; }
  .env-back {
    position: absolute; inset: 0; border-radius: 3px;
    background: repeating-linear-gradient(135deg, var(--red) 0 12px, var(--paper) 12px 24px, #2d6cb5 24px 36px, var(--paper) 36px 48px);
  }
  .env-back::after { content: ""; position: absolute; inset: 7px; background: #9c7a45; border-radius: 1px; }

  .letter {
    position: absolute; left: 8%; right: 8%; top: 9%; height: 84%;
    background: var(--paper); z-index: 2; padding: 14px 14px;
    transform: translateY(calc(var(--p) * -58%));
    box-shadow: 0 -2px 8px rgba(0,0,0,.25);
    background-image: repeating-linear-gradient(transparent 0 17px, rgba(111,96,72,.18) 17px 18px);
  }
  .letter .cap { display: block; margin: 0 auto 6px; width: 32px; color: var(--ink); }
  .letter .line { height: 5px; background: #cbbd96; margin: 9px auto; }
  .letter .line:nth-child(3) { width: 70%; }
  .letter .line:nth-child(4) { width: 85%; }
  .letter .line:nth-child(5) { width: 55%; }

  .pocket {
    position: absolute; inset: 7px; z-index: 3; pointer-events: none;
    background: linear-gradient(180deg, var(--kraft-2), var(--kraft));
    clip-path: polygon(0 0, 50% 52%, 100% 0, 100% 100%, 0 100%);
  }
  .pocket::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,.22), transparent 45%, rgba(0,0,0,.12));
  }
  .flap {
    position: absolute; left: 7px; right: 7px; top: 7px; height: 54%; z-index: 4;
    transform-origin: 50% 0; transform: rotateX(calc(var(--p) * -180deg));
    background: linear-gradient(180deg, #e0c28c, var(--kraft-2));
    clip-path: polygon(0 0, 100% 0, 50% 100%);
  }
  .env.back-layer .flap { z-index: 1; background: #8a6a3a; }

  .seal {
    position: absolute; left: 50%; top: 55%; z-index: 5; width: 58px; height: 58px;
    transform: translate(-50%, -62%) scale(calc(1 - var(--p) * .4));
    opacity: calc(1 - var(--p) * 3);
    border-radius: 50%; background: var(--ink); border: 3px solid var(--amber);
    box-shadow: 0 0 0 3px var(--ink), 0 4px 10px rgba(0,0,0,.45);
    display: grid; place-items: center; color: var(--amber); pointer-events: none;
    font-family: var(--pixel); font-size: 21px; line-height: .9; text-align: center;
  }
  .minimap { margin-top: 14px; border: 2px solid var(--ink); height: 170px; overflow: hidden; }
  .minimap iframe { width: 100%; height: 100%; border: 0; display: block; }
  .address {
    position: absolute; left: 14%; bottom: 13%; z-index: 5; pointer-events: none;
    font-size: 10px; line-height: 1.6; color: var(--ink); letter-spacing: .04em;
  }
  .address b { font-weight: 600; }
  .stamp {
    position: absolute; right: 11%; bottom: 12%; z-index: 5; width: 54px; height: 64px; pointer-events: none;
    background: var(--paper); color: var(--ink); padding: 5px; transform: rotate(3deg);
    -webkit-mask: radial-gradient(circle 3px at 50% 0, transparent 98%, #000) top/9px 51% repeat-x;
    outline: 1.5px dashed var(--ink); outline-offset: -3px;
  }
  .stamp svg { width: 100%; height: 100%; display: block; }
  .postmark {
    position: absolute; right: 7%; bottom: 9%; z-index: 5; width: 84px; height: 84px; pointer-events: none;
    opacity: .6; transform: rotate(-14deg); color: var(--ink);
  }

  .hint { text-align: center; color: var(--amber); font-family: var(--pixel); font-size: 22px; letter-spacing: .06em; transition: opacity .4s; text-shadow: 0 0 8px rgba(255,176,0,.45); }
  .hint .arrow { display: block; font-size: 28px; animation: bob 1.3s steps(4) infinite; }
  .hint .cursor { display: inline-block; width: .5em; height: .1em; background: var(--amber); margin-left: 2px; animation: blink 1s steps(1) infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-8px);} }
  .stage.gone ~ .hint { opacity: 0; pointer-events: none; }

  /* ---------- Thiệp ---------- */
  .card-wrap {
    position: fixed; inset: 0; display: none; z-index: 10; overflow-y: auto;
    padding: 24px 12px 40px; background: rgba(12,9,5,.9);
  }
  .card-wrap.show { display: flex; }
  .card {
    position: relative; margin: auto; width: min(96vw, 480px); background: var(--paper);
    border: 2px solid var(--ink); box-shadow: 7px 7px 0 var(--amber);
    animation: rise .8s cubic-bezier(.2,.9,.3,1.1) both;
    background-image: radial-gradient(rgba(111,96,72,.12) 1px, transparent 1px); background-size: 6px 6px;
  }
  @keyframes rise { from { transform: translateY(80px) scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
  .titlebar {
    display: flex; align-items: center; gap: 6px; background: var(--ink); color: var(--amber);
    padding: 6px 10px; font-family: var(--pixel); font-size: 19px; letter-spacing: .05em;
  }
  .titlebar i { width: 10px; height: 10px; border: 1.5px solid var(--amber); display: block; }
  .titlebar i:first-child { background: var(--amber); }
  .titlebar span { margin-left: 6px; }
  .body { padding: 22px 22px 24px; text-align: center; }
  .cap-big { width: 54px; margin: 0 auto 4px; display: block; color: var(--ink); }
  .kicker { font-family: var(--pixel); font-size: 20px; letter-spacing: .25em; color: var(--muted); }
  .to { font-size: 13px; margin: 10px 0 0; color: var(--muted); }
  .to b { color: var(--red); font-weight: 600; }
  .name {
    font-family: var(--pixel); font-size: clamp(40px, 12vw, 58px); line-height: 1; margin: 8px 0 10px;
    letter-spacing: .03em; color: var(--ink); text-shadow: 3px 3px 0 var(--amber);
  }
  .msg { font-size: 13px; line-height: 1.75; color: #4a3d2c; margin: 12px 4px 0; text-align: left; }
  .msg::before { content: "/* "; color: var(--teal); }
  .msg::after { content: " */"; color: var(--teal); }

  .divider { height: 0; border-top: 2px solid var(--ink); margin: 18px 0 6px; opacity: .8; }
  .kv { display: flex; gap: 10px; align-items: baseline; border-bottom: 1px dashed #a79773; padding: 6px 0; text-align: left; }
  .kv small { flex: 0 0 96px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .kv strong { font-size: 13px; font-weight: 600; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
  .btn {
    font-family: var(--pixel); font-size: 20px; letter-spacing: .06em; padding: 4px 16px 3px; cursor: pointer;
    border: 2px solid var(--ink); text-decoration: none; display: inline-block; color: var(--ink); background: var(--paper);
    box-shadow: 3px 3px 0 var(--ink); transition: transform .1s, box-shadow .1s;
  }
  .btn:hover { transform: translate(1px,1px); box-shadow: 2px 2px 0 var(--ink); }
  .btn:active { transform: translate(3px,3px); box-shadow: 0 0 0 var(--ink); }
  .btn.primary { background: var(--ink); color: var(--amber); }

  canvas#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 40; }

  @media (prefers-reduced-motion: reduce) {
    .hint .arrow, .title h1::after, .hint .cursor { animation: none; }
    .card { animation-duration: .01s; }
  }
</style>
</head>
<body>

<main>
  <header class="title">
    <small>&gt; thư mời</small>
    <h1>LỄ TỐT NGHIỆP</h1>
  </header>

  <div class="stage" id="stage">
    <div class="env" id="env" tabindex="0" role="button" aria-label="Phong bì thiệp mời. Kéo lên hoặc nhấn Enter để mở">
      <div class="env-back"></div>
      <div class="letter">
        <svg class="cap" viewBox="0 0 64 64" aria-hidden="true"><use href="#capIcon"/></svg>
        <div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div>
      </div>
      <div class="pocket"></div>
      <div class="flap"></div>
      <div class="address"><br>FROM: <b id="envFrom"></b></div>
      <div class="stamp"><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#capIcon"/></svg></div>
      <svg class="postmark" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="3"/>
        <circle cx="50" cy="50" r="31" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <text x="50" y="47" text-anchor="middle" font-family="VT323, monospace" font-size="19" fill="currentColor">ĐÀ NẴNG</text>
        <text x="50" y="64" text-anchor="middle" font-family="VT323, monospace" font-size="17" fill="currentColor" id="pmDate"></text>
        <path d="M95 38h30M95 50h30M95 62h30" stroke="currentColor" stroke-width="3" opacity="0"/>
      </svg>
      <div class="seal">▲<br>MỞ</div>
    </div>
  </div>

  <div class="hint" id="hint"><span class="arrow">↑</span>&gt; kéo phong bì lên để giải nén thiệp<span class="cursor"></span></div>

  <div class="card-wrap" id="cardWrap">
    <article class="card" id="card">
      <div class="titlebar"><i></i><i></i><i></i><span id="fileName">graduation_invite.txt</span></div>
      <div class="body">
        <svg class="cap-big" viewBox="0 0 64 64" aria-hidden="true"><use href="#capIcon"/></svg>
        <div class="kicker">// THƯ MỜI TỐT NGHIỆP</div>
        <p class="to">Trân trọng kính mời bạn đến chung vui trong lễ tốt nghiệp của</p>
        <div class="name" id="gradName"></div>
        <p class="msg" id="message"></p>

        <div class="divider"></div>
        <div class="kv"><small>Họ tên</small><strong id="vName"></strong></div>
        <div class="kv"><small>Bằng cấp</small><strong id="vDegree"></strong></div>
        <div class="kv"><small>Ngành</small><strong id="vMajor"></strong></div>
        <div class="kv"><small>Trường</small><strong id="vSchool"></strong></div>
        <div class="kv"><small>Khóa</small><strong id="vClass"></strong></div>
        <div class="divider"></div>
        <div class="kv"><small>Ngày</small><strong id="vDate"></strong></div>
        <div class="kv"><small>Giờ</small><strong id="vTime"></strong></div>
        <div class="kv"><small>Địa điểm</small><strong id="vVenue"></strong></div>
        <div class="kv"><small>Thành phố</small><strong id="vCity"></strong></div>

        <div class="minimap"><iframe id="mapFrame" title="Bản đồ địa điểm" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe></div>

        <div class="actions">
          <a class="btn" id="mapBtn" target="_blank" rel="noopener">XEM BẢN ĐỒ</a>
          <button class="btn" id="closeBtn" type="button">GẤP THIỆP LẠI</button>
        </div>
      </div>
    </article>
  </div>
</main>

<canvas id="confetti"></canvas>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="capIcon" viewBox="0 0 64 64">
    <path d="M32 10 2 25l30 15 30-15z" fill="currentColor"/>
    <path d="M16 33v12c0 4 7 9 16 9s16-5 16-9V33l-16 8z" fill="currentColor" opacity=".78"/>
    <path d="M58 27v18" stroke="#d9482b" stroke-width="3" stroke-linecap="round"/>
    <rect x="55" y="45" width="6" height="7" fill="#d9482b"/>
  </symbol>
</svg>

<script>
/* ============ THÔNG TIN THIỆP ============ */
const CONFIG = {
  name:    "Nguyễn Đỗ Khánh Hưng",
  degree:  "Cử nhân (Bachelor)",
  major:   "Computer Science",
  school:  "Troy University",
  cls:     "K28",
  date:    "Chủ Nhật, 18/10/2026",
  dateShort: "18.10.26",
  time:    "2:00 PM (14:00)",
  venue:   "03 Quang Trung",
  city:    "Đà Nẵng",
  message: "Sau bao đêm debug và deadline, bản build \"Cử nhân\" cuối cùng cũng chạy ổn. Mời bạn đến chung vui — sự có mặt của bạn là bản release đẹp nhất của ngày hôm đó."
};
/* ======================================== */

const $ = id => document.getElementById(id);
$("gradName").textContent = CONFIG.name;
$("envFrom").textContent = CONFIG.name;
$("pmDate").textContent = CONFIG.dateShort;
$("message").textContent = CONFIG.message;
$("vName").textContent = CONFIG.name;
$("vDegree").textContent = CONFIG.degree;
$("vMajor").textContent = CONFIG.major;
$("vSchool").textContent = CONFIG.school;
$("vClass").textContent = CONFIG.cls;
$("vDate").textContent = CONFIG.date;
$("vTime").textContent = CONFIG.time;
$("vVenue").textContent = CONFIG.venue;
$("vCity").textContent = CONFIG.city;
$("mapBtn").href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(CONFIG.venue + ", " + CONFIG.city);
$("mapFrame").src = "https://www.google.com/maps?q=" + encodeURIComponent(CONFIG.venue + ", " + CONFIG.city) + "&z=16&output=embed";
document.title = "Thiệp mời tốt nghiệp · " + CONFIG.name;

/* ---------- kéo phong bì ---------- */
const env = $("env"), stage = $("stage"), cardWrap = $("cardWrap");
let p = 0, dragging = false, startY = 0, startP = 0, moved = 0, raf = 0, opened = false;

function setP(v) {
  p = Math.max(0, Math.min(1, v));
  env.style.setProperty("--p", p);
  env.classList.toggle("back-layer", p > 0.5);
}

function animateTo(target) {
  cancelAnimationFrame(raf);
  const from = p, t0 = performance.now(), dur = 450 * Math.max(.4, Math.abs(target - from));
  (function step(now) {
    const k = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - k, 3);
    setP(from + (target - from) * e);
    if (k < 1) raf = requestAnimationFrame(step);
    else if (target === 1) setTimeout(reveal, 250);
  })(t0);
}

env.addEventListener("pointerdown", e => {
  if (opened) return;
  dragging = true; moved = 0; startY = e.clientY; startP = p;
  cancelAnimationFrame(raf);
  env.setPointerCapture(e.pointerId);
});
env.addEventListener("pointermove", e => {
  if (!dragging) return;
  const dy = startY - e.clientY;
  moved = Math.max(moved, Math.abs(dy));
  setP(startP + dy / 170);
});
function endDrag() {
  if (!dragging) return;
  dragging = false;
  if (moved < 6) animateTo(p < .5 ? 1 : 0);   /* chạm nhẹ = mở */
  else animateTo(p > .5 ? 1 : 0);
}
env.addEventListener("pointerup", endDrag);
env.addEventListener("pointercancel", endDrag);
env.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); if (!opened) animateTo(1); }
});

function reveal() {
  opened = true;
  stage.classList.add("gone");
  cardWrap.classList.add("show");
  cardWrap.scrollTop = 0;
  burst();
}
$("closeBtn").addEventListener("click", () => {
  cardWrap.classList.remove("show");
  stage.classList.remove("gone");
  opened = false;
  animateTo(0);
  env.focus({ preventScroll: true });
});

/* ---------- confetti (ô vuông pixel) ---------- */
const cv = $("confetti"), ctx = cv.getContext("2d");
let parts = [], running = false;
function fit() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
addEventListener("resize", fit); fit();
function burst() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const colors = ["#ffb000", "#3ec9a7", "#d9482b", "#f3e9cf", "#2d6cb5"];
  const d = devicePixelRatio;
  for (let i = 0; i < 130; i++) {
    const a = Math.random() * Math.PI * 2, s = 6 + Math.random() * 10, z = (4 + Math.random() * 6) * d;
    parts.push({
      x: cv.width / 2, y: cv.height * .45, vx: Math.cos(a) * s * d, vy: (Math.sin(a) * s - 6) * d,
      w: z, h: z, c: colors[(Math.random() * colors.length) | 0], life: 1
    });
  }
  if (!running) { running = true; requestAnimationFrame(tick); }
}
function tick() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  parts = parts.filter(q => q.life > 0 && q.y < cv.height + 40);
  for (const q of parts) {
    q.vy += .3 * devicePixelRatio; q.vx *= .99; q.x += q.vx; q.y += q.vy; q.life -= .006;
    ctx.globalAlpha = Math.max(0, q.life); ctx.fillStyle = q.c;
    ctx.fillRect(Math.round(q.x), Math.round(q.y), q.w, q.h);
  }
  if (parts.length) requestAnimationFrame(tick); else running = false;
}
</script>
</body>
</html>
